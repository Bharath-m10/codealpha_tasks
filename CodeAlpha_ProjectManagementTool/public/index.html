<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard - CodeAlpha Project Management Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">TaskBoard (Kanban)</div>
    <div class="active-project">Project: CodeAlpha Web Sprint</div>
  </header>

  <main class="board-wrapper">
    <div class="board-top">
      <h2>Project Tasks</h2>
      <button class="primary-btn" onclick="openCreateModal()">+ Add New Task</button>
    </div>

    <div class="kanban-grid">
      <!-- To Do -->
      <div class="kanban-column" id="col-todo">
        <div class="column-header header-todo">To Do (<span id="count-todo">0</span>)</div>
        <div class="column-cards" id="cards-todo"></div>
      </div>

      <!-- In Progress -->
      <div class="kanban-column" id="col-inprogress">
        <div class="column-header header-progress">In Progress (<span id="count-inprogress">0</span>)</div>
        <div class="column-cards" id="cards-inprogress"></div>
      </div>

      <!-- Done -->
      <div class="kanban-column" id="col-done">
        <div class="column-header header-done">Done (<span id="count-done">0</span>)</div>
        <div class="column-cards" id="cards-done"></div>
      </div>
    </div>
  </main>

  <!-- Add Task Modal -->
  <div id="taskModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCreateModal()">&times;</span>
      <h3>Create New Task</h3>
      <div class="form-group">
        <label>Task Title</label>
        <input type="text" id="taskTitle" placeholder="e.g. Implement User Authentication">
      </div>
      <div class="form-group">
        <label>Assign To</label>
        <input type="text" id="taskAssignee" placeholder="e.g. Bharath">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="taskStatus">
          <option value="TODO">To Do</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="DONE">Done</option>
        </select>
      </div>
      <button class="primary-btn" style="width:100%; margin-top:12px;" onclick="createTask()">Create Task</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
